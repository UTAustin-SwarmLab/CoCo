[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coco-forecast"
version = "0.1.0"
description = "CoCo: standalone text-aided time-series forecasting"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.9.0",
  "transformers==4.57.3",
  "peft==0.19.1",
  "chronos-forecasting==2.1.0",
  "numpy==2.1.3",
  "pandas==2.3.3",
  "accelerate==1.12.0",
  "huggingface-hub==0.36.0",
  "safetensors==0.7.0",
  "tokenizers==0.22.1",
]

[project.optional-dependencies]
vllm = [
  "vllm==0.11.2",
  "flashinfer-python==0.5.2",
  "flashinfer-cubin==0.5.2",
]

[tool.setuptools.packages.find]
where = ["src"]
